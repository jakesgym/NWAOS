<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SEP Foundation</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SEP">
<meta name="theme-color" content="#0b0d10">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0d10;color:#e8ecf1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{overscroll-behavior:none}
#touch{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#touch.on{display:block}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:43px;top:43px;width:50px;height:50px;border-radius:50%;background:rgba(255,179,71,.6);border:2px solid rgba(255,255,255,.55);pointer-events:none}
#tbtns{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,64px);gap:9px;pointer-events:auto;direction:rtl}
.tb{direction:ltr;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(20,26,34,.75);color:#fff;font:700 11px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;line-height:1.15;padding:0}
.tb b{font-size:21px;font-weight:400}
.tb.down{background:rgba(255,179,71,.85);color:#1a1206}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,10,.72);backdrop-filter:blur(3px);z-index:10;overflow:auto;padding:18px}
.ov.on{display:flex}
.panel{background:#151a21;border:1px solid #2b3440;border-radius:14px;padding:22px 24px;max-width:1000px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:100%;overflow:auto}
h1{margin:0;font-size:34px;letter-spacing:.14em}
h2{margin:0 0 8px;font-size:22px}
.sub{color:#9fb0c2;letter-spacing:.32em;font-size:12px;margin-top:4px;text-transform:uppercase}
h3{margin:18px 0 8px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#9fb0c2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.card{background:#1c232c;border:1px solid #2e3946;border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .08s,border-color .1s}
.card:hover:not(:disabled){border-color:#ffb347;transform:translateY(-2px)}
.card:disabled{opacity:.45;cursor:not-allowed}
.card b{display:block;font-size:15px}
.card small{color:#9fb0c2;display:block;margin-top:3px;line-height:1.35;font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#2a3340;margin-top:7px;font-weight:600}
.tag.go{background:#ffb347;color:#1a1206}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
label{font-size:13px;color:#b9c6d4;display:flex;gap:6px;align-items:center}
input,select{background:#0f1318;color:#e8ecf1;border:1px solid #2e3946;border-radius:8px;padding:7px 9px;font:inherit}
input[type=color]{padding:2px;width:42px;height:32px}
.btn{background:#ffb347;color:#1a1206;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit;font-weight:700}
.btn.sec{background:#2a3340;color:#e8ecf1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.wallet{display:flex;gap:20px;margin-top:14px;font-weight:700;flex-wrap:wrap}
.help{color:#8494a6;font-size:12.5px;line-height:1.7;margin-top:16px}
.help kbd{background:#2a3340;border-radius:4px;padding:1px 6px;color:#dfe7ef;font-size:12px}
.shopi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #232b35}
.shopi small{color:#9fb0c2;display:block;font-size:12.5px}
.dlg{max-width:480px}
.calcout{background:#9db88a;color:#1d2a14;font-family:ui-monospace,Consolas,monospace;border-radius:8px;padding:12px;min-height:58px;margin:10px 0;font-weight:700;font-size:15px}
.opt{display:block;width:100%;margin-top:8px;text-align:left}
.swl{display:inline-flex;align-items:center;gap:5px;margin:4px 10px 4px 0;flex-wrap:wrap}.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff4;cursor:pointer;padding:0}.sw.on{border:3px solid #ffe14a;box-shadow:0 0 6px #ffe14a}
.acct{background:#0f141b;border:1px solid #263142;border-radius:10px;padding:8px 12px;margin-bottom:6px}.acct .note{color:#8494a6;font-size:12.5px;margin:4px 0}.acct p{margin:5px 0}.acct a{color:#7fc4ff}.qlist{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#bar58{position:fixed;top:10px;left:0;right:0;margin:0 auto;width:fit-content;display:none;gap:6px;z-index:30;background:#0d1117e6;border:1px solid #3b2a55;border-radius:12px;padding:6px;flex-wrap:wrap;justify-content:center;max-width:96vw}.b58{background:#1b2230;color:#e8ecf1;border:1px solid #2d3645;border-radius:9px;padding:4px 9px;font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;min-width:56px;cursor:pointer;touch-action:none}.b58 b{font-size:20px}.b58.on{background:#3b2a55;border-color:#b46bff;box-shadow:0 0 8px #b46bff88}#col58{width:44px;height:48px;border:none;background:none;padding:0;cursor:pointer}#trash58{position:fixed;right:24px;bottom:110px;width:96px;height:96px;border-radius:18px;background:#2a1220e6;border:3px dashed #ff5a7a;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:44px;z-index:30;pointer-events:none;transition:transform .1s}#trash58 small{font:600 10px system-ui;color:#ffb3c2}#trash58.hot{transform:scale(1.18);background:#5a1230}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"><div id="joy"><div id="knob"></div></div><div id="tbtns"></div></div>

<div id="menu" class="ov on"><div class="panel" id="menuP"></div></div>
<div id="death" class="ov"><div class="panel dlg" id="deathP"></div></div>
<div id="shop" class="ov"><div class="panel dlg" id="shopP"></div></div>
<div id="calc" class="ov"><div class="panel dlg">
  <h2>E27 · Insulting Calculator</h2>
  <div class="calcout" id="calcOut">Go on then. Type a sum. I dare you.</div>
  <div class="row"><input id="calcIn" placeholder="e.g. 3 + 7" style="flex:1"><button class="btn" id="calcGo">=</button></div>
  <div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeOv('calc')">Walk away (Esc)</button></div>
</div></div>
<div id="calcp" class="ov"><div class="panel dlg" id="calcpP"></div></div>
<div id="prank" class="ov"><div class="panel dlg" id="prankP"></div></div>
<div id="console" class="ov"><div class="panel dlg" id="consoleP"></div></div>
<div id="escape" class="ov"><div class="panel dlg" id="escapeP"></div></div>
<div id="pbar" style="position:fixed;right:14px;top:50%;transform:translateY(-50%);display:none;z-index:5;background:rgba(12,16,21,.9);border:1px solid #2b3440;border-radius:12px;padding:10px;width:200px;font:13px system-ui;color:#e8ecf1"></div>
<div id="testdlg" class="ov"><div class="panel dlg" id="testP"></div></div>
<div id="notedlg" class="ov"><div class="panel dlg"><h2>Write on yourself</h2><p style="color:#9fb0c2">Everyone will be able to read it.</p><div class="row"><input id="noteIn" maxlength="60" placeholder="e.g. TWIG IS ABOUT TO BLOW!" style="flex:1"><button class="btn" id="noteGo">Write</button></div><div class="row" style="margin-top:10px"><button class="btn sec" onclick="closeOv('notedlg')">Cancel (Esc)</button></div></div></div>

function coolness(hex){const[h,s,l]=rgbHsl(...hexRgb(hex));if(s<.18||l<.1||l>.93)return 0;if(h>=12&&h<=50)return -1;if(h>=185&&h<=255)return 1;if(h>255&&h<=320)return .7;if(h>=75&&h<185)return .55;return 0;}

 const E=v.e||{};const keep=[];
 for(const id in E){if(NET.pend.e[id]>now)continue;let e=NET.cmap.get(id);const o=E[id];if(!e||e.kind!==o.kind||(o.type&&e.type!==decV(o.type))||(o.role&&e.role!==decV(o.role))){e=mkFrom(o);if(!e)continue;e.id=isNaN(+id)?id:+id;e._new=true;NET.cmap.set(id,e);}}
 for(const id of [...NET.cmap.keys()])if(!(id in E)||NET.pend.e[id]>now){NET.cmap.delete(id);delete B.e[id];}
 for(const [id,e] of NET.cmap){const o=E[id];applyEnt(e,o,B.e[id]&&B.e[id]._raw,!e._new);if(e._new){e.x=o.x;e.y=o.y;e.tx=o.x;e.ty=o.y;delete e._new;}const ser=serEnt(e);ser._raw=o;B.e[id]=ser;keep.push(e);}
 const local=ents.filter(e=>e!==P&&!e.remote&&!NET.cmap.has(String(e.id))&&e._sent&&now-e._sent<1500&&!e.dead);
 ents=keep.concat(local,[...NET.ghosts.values()].filter(g=>!g.dead));if(P&&!P.dead)ents.push(P);
 const D=v.d||{};doors.forEach((d,i)=>{if(D[i]!==undefined&&D[i]!==B.d[i]){applyDoor(d,D[i]);B.d[i]=serDoor(d);}});
 for(const [key,arrName] of [['m','messes'],['p','pickups']]){const M=v[key]||{},cur=arrName==='m'||key==='m'?messes:pickups,byN=new Map(cur.filter(x=>x.nid).map(x=>[String(x.nid),x]));const out=[];
  for(const n in M){if(NET.pend[key][n]>now)continue;let x=byN.get(n);const o=decV(M[n]);if(!o)continue;if(!x)x={};for(const k in x)if(!(k in o)&&k!=='nid')delete x[k];Object.assign(x,o);x.nid=+n;out.push(x);B[key][n]=serThing(x);}
  for(const n in B[key])if(!(n in M))delete B[key][n];
  for(const x of cur)if(!x.nid&&x._sent&&now-x._sent<1500)out.push(x);if(key==='m')messes=out;else pickups=out;}
 const TR=v.tr||{};TRAYS.forEach((t,i)=>{if(TR[i]!==undefined&&TR[i]!==B.tr[i]){const o=decV(TR[i])||{};t.food=o.f||null;t.t=o.t||0;t.by=o.b||null;B.tr[i]=serTray(t);}});
 const tp=v.tp||'{}';if(tp!==B.tp){try{TPAINT=JSON.parse(tp);}catch(e){TPAINT={};}B.tp=tp;mapDirty=true;}
 const tl=v.tl||'';if(tl!==B.tl){grid.set(ORIG);if(tl)for(const p of tl.split(',')){const [i,g]=p.split(':');grid[+i]=+g;}B.tl=tl;B.grid=grid.slice();mapDirty=true;}
 if(v.g&&v.g!==B.gs){const g=decV(v.g)||{};openAll=!!g.oa;if(g.at>0&&g.ax&&(alarmT<=0||alarmTxt!==g.ax)){alarmT=g.at;alarmTxt=g.ax;}B.gs=v.g;B.g=openAll;}
 if(v.sh){const sh=decV(v.sh)||[];for(const s of sh){const key='h:'+s[0];if(NET.seenShots[key])continue;NET.seenShots[key]=1;bullets.push({x:s[1],y:s[2],vx:s[3],vy:s[4],kind:s[5],life:s[5]==='fire'?.38:.8,fake:true,dmg:0});}}}

function mergeAct(A,b){if(b.e){A.e=A.e||{};for(const id in b.e){const t=A.e[id]||(A.e[id]={});for(const k in b.e[id]){if(k==='hp'&&t.hp)t.hp={d:Math.round((t.hp.d+b.e[id].hp.d)*10)/10};else t[k]=b.e[id][k];}}}
 if(b.tp)A.tp=b.tp;if(b.sp)A.sp=(A.sp||[]).concat(b.sp);if(b.d)A.d=Object.assign(A.d||{},b.d);if(b.tr)A.tr=Object.assign(A.tr||{},b.tr);if(b.tg)A.tg=(A.tg||[]).concat(b.tg);if(b.oa!==undefined)A.oa=b.oa;
 for(const key of ['m','p'])if(b[key]){const c=A[key]||(A[key]={add:[],set:{},rm:[]});c.add=c.add.concat(b[key].add);Object.assign(c.set,b[key].set);c.rm=c.rm.concat(b[key].rm);}}
function clientDiff(){const B=NET.base,now=Date.now(),act={};let any=false;const E={};
 const diffOne=(e,base,id)=>{const cur=serEnt(e),f={};for(const k in cur){if(k==='face'||k==='aim'||k==='_raw')continue;if(cur[k]!==base[k])f[k]=k==='hp'?{d:Math.round((e.hp-decV(base.hp))*10)/10}:cur[k];}for(const k in base)if(k!=='_raw'&&!(k in cur))f[k]=null;if(f.hp&&!f.hp.d)delete f.hp;
  if(Object.keys(f).length){E[id]=f;any=true;cur._raw=base._raw;return cur;}return null;};
 for(const [id,e] of NET.cmap){const b=B.e[id];if(!b)continue;const nb=diffOne(e,b,id);if(nb)B.e[id]=nb;if(e.dead&&!b.dead)NET.pend.e[id]=now+2500;}
 for(const g of NET.ghosts.values()){if(g.dead&&!g._dd){g._dd=1;}if(!g._gb){g._gb=serEnt(g);continue;}const nb=diffOne(g,g._gb,'p:'+g.remote);if(nb)g._gb=nb;}
 if(any)act.e=E;
 const sp=[];for(const e of ents){if(e===P||e.remote||NET.cmap.has(String(e.id))||e._sent)continue;e._sent=now;sp.push(serEnt(e,true));}if(sp.length){act.sp=sp;any=true;}
 const D={};doors.forEach((d,i)=>{const s=serDoor(d);if(B.d[i]!==s){D[i]=s;B.d[i]=s;any=true;}});if(Object.keys(D).length)act.d=D;
 for(const key of ['m','p']){const arr=key==='m'?messes:pickups,add=[],set={},rm=[];const present=new Set();
  for(const x of arr){if(!x.nid){if(!x._sent){x._sent=now;add.push(serThing(x));}continue;}present.add(String(x.nid));const s=serThing(x);if(B[key][x.nid]!==undefined&&B[key][x.nid]!==s){set[x.nid]=s;B[key][x.nid]=s;}}
  for(const n in B[key])if(!present.has(n)){rm.push(n);NET.pend[key][n]=now+2500;delete B[key][n];}
  if(add.length||rm.length||Object.keys(set).length){act[key]={add,set,rm};any=true;}}
 const TR={};TRAYS.forEach((t,i)=>{const s=serTray(t);if(B.tr[i]!==undefined&&B.tr[i]!==s){TR[i]=s;B.tr[i]=s;any=true;}});if(Object.keys(TR).length)act.tr=TR;
 const tg=[];for(let i=0;i<grid.length;i++)if(grid[i]!==B.grid[i]){tg.push([i,grid[i]]);B.grid[i]=grid[i];}if(tg.length){act.tg=tg;any=true;}
 {const tp=JSON.stringify(TPAINT);if(B.tp!==undefined&&tp!==B.tp){act.tp=tp;B.tp=tp;any=true;}}
 if(B.g!==undefined&&B.g!==null&&openAll!==B.g){act.oa=openAll;B.g=openAll;any=true;}
 if(any){NET.buf=NET.buf||{};mergeAct(NET.buf,act);}
 if(NET.buf&&now-(NET.tc||0)>110){NET.tc=now;const a=NET.buf;NET.buf=null;a.u=NET.uid;a.lid=P&&P.lid;NET.ref('acts').push(a);}}

// host: apply what a client changed
function hostApply(a){const g=NET.ghosts.get(a.u)||null;
 asActor(g,()=>{
  if(a.e)for(const id in a.e){const t=NET.ent(id);if(!t)continue;const f=a.e[id];
   if(t===P){patchP(f);continue;}
   const src=f.lastSrc!==undefined?decV(f.lastSrc):g,cause=f.lastCause!==undefined?decV(f.lastCause):null;
   for(const k in f){if(k==='hp'||k==='dead'||k==='id'||k==='kind'||k==='x'||k==='y')continue;t[k]=decV(f[k]);}
   if(f.hp&&f.hp.d){t.hp=Math.min(t.maxhp||1e9,t.hp+f.hp.d);if(t.hp<=0&&!t.dead){if(t.remote){}else{t.hp=1;kill(t,decV(f.killedBy)||src,decV(f.deathCause)||cause||'killed');}}}
   if(f.dead&&!t.dead&&!t.remote){if(f.deathCause!==undefined)kill(t,decV(f.killedBy)||src,decV(f.deathCause));else t.dead=true;}}
  if(a.sp)for(const o of a.sp){const e=mkFrom(o);if(!e)continue;const id=e.id;applyEnt(e,o,null,false);e.id=id;e.x=o.x;e.y=o.y;e.isPlayer=false;delete e.remote;ents.push(e);}
  if(a.d)for(const i in a.d)if(doors[i])applyDoor(doors[i],a.d[i]);
  for(const key of ['m','p']){const c=a[key];if(!c)continue;const arr=key==='m'?messes:pickups;
   for(const s of c.add||[]){const o=decV(s);if(!o)continue;if(key==='m'&&o.type==='corpse'&&arr.some(m=>m.type==='corpse'&&Math.hypot(m.x-o.x,m.y-o.y)<28))continue;o.nid=NET.nidSeq++;arr.push(o);}
   for(const n in c.set||{}){const x=arr.find(x=>String(x.nid)===n);const o=decV(c.set[n]);if(x&&o)Object.assign(x,o);}
   for(const n of c.rm||[]){const i=arr.findIndex(x=>String(x.nid)===String(n));if(i>=0)arr.splice(i,1);}}
  if(a.tr)for(const i in a.tr){const t=TRAYS[i],o=decV(a.tr[i]);if(t&&o){t.food=o.f||null;t.t=o.t||0;t.by=o.b||null;}}
  if(a.tg){for(const [i,v] of a.tg)grid[i]=v;mapDirty=true;}
  if(a.oa!==undefined)openAll=!!a.oa;if(a.tp){try{TPAINT=JSON.parse(a.tp);}catch(e){}mapDirty=true;}
 },true);}

function solidTile(tx,ty){if(tx<0||ty<0||tx>=W||ty>=H)return true;const g=grid[ix(tx,ty)];if(g===WALL||g===GLASS)return true;if(g===DOOR){const d=doors[doorMap[ix(tx,ty)]];return !d.broken&&d.open<.9;}return false;}
function hitsSolid(x,y,r){const x0=Math.floor((x-r)/T),x1=Math.floor((x+r)/T),y0=Math.floor((y-r)/T),y1=Math.floor((y+r)/T);for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(!solidTile(tx,ty))continue;const cx=clamp(x,tx*T,tx*T+T),cy=clamp(y,ty*T,ty*T+T);if((x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r)return true;}return false;}
function move(e,dx,dy){if(e.ghost){e.x=clamp(e.x+dx,T,(W-1)*T);e.y=clamp(e.y+dy,T,(H-1)*T);return;}if(dx&&!hitsSolid(e.x+dx,e.y,e.r))e.x+=dx;if(dy&&!hitsSolid(e.x,e.y+dy,e.r))e.y+=dy;}
function canOpen(e,d){if(d.broken||openAll)return true;if(e.kind!=='h'||e.sleep>0||e.cage>0||e.duck||e.cuffedBy||e.escortMe)return false;if(e.isPlayer&&e.role==='dclass')return false;if(e.testPass&&e.testPass.has(d.room))return true;if(e.outerPass&&e.outerPass===d.room&&!d.inner)return true;if(e.isPlayer&&!e.sticky)return d.level===0||(e.items[e.sel]==='keycard'&&e.card>=d.level);return e.card>=d.level;}

function passable(i,e){const g=grid[i];if(g===WALL||g===GLASS)return false;if(g===DOOR){const d=doors[doorMap[i]];return d.broken||d.hold||openAll||d.cardT>0||canOpen(e,d)||!!e.cuffedBy||!!e.escortMe;}return true;}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function findPath(e,gx,gy){gx=clamp(gx|0,0,W-1);gy=clamp(gy|0,0,H-1);const s=ix(Math.floor(e.x/T),Math.floor(e.y/T)),g=ix(gx,gy);if(!passable(g,e))return null;const prev=new Int32Array(W*H).fill(-1);prev[s]=s;const q=[s];let h=0;while(h<q.length){const c=q[h++];if(c===g)break;const cx=c%W,cy=(c/W)|0;for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ix(nx,ny);if(prev[n]!==-1||!passable(n,e))continue;prev[n]=c;q.push(n);}}if(prev[g]===-1)return null;const p=[];for(let c=g;c!==s;c=prev[c])p.push(c);p.reverse();return p;}
function los(a,b,glassOK){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),n=Math.ceil(d/12);for(let k=1;k<n;k++){const tx=Math.floor((a.x+dx*k/n)/T),ty=Math.floor((a.y+dy*k/n)/T);if(tx<0||ty<0||tx>=W||ty>=H)return false;const g=grid[ix(tx,ty)];if(g===WALL)return false;if(g===GLASS&&!glassOK)return false;if(g===DOOR){const dd=doors[doorMap[ix(tx,ty)]];if(!dd.broken&&dd.open<.6&&!(dd.glass&&glassOK))return false;}}return true;}

 cd:0,cd2:0,cd3:0,sleep:0,cage:0,blind:0,blindCd:0,cageCd:0,revealT:0,aggro:0,emT:0,emCd:0,stabT:0,tcd:0,hurtT:0,pcd:0,card:base[role],speed:role==='guard'?135:120,hp:role==='scientist'?140:100,maxhp:role==='scientist'?140:100,items:role==='guard'?['gun','tranq']:[],sel:0,aim:0,walk:0,face:0,flags:new Set()},o||{});}
function mkAnom(type,x,y,o){const d=AD[type];return Object.assign({id:nid++,kind:'a',type,x,y,r:d.r,hp:d.hp,maxhp:d.hp,name:d.name,home:d.room?R[d.room]:null,hx:x,hy:y,speed:d.speed,card:-1,cd:0,cd2:0,cd3:0,sleep:0,cage:0,blind:0,blindCd:0,cageCd:0,revealT:0,aggro:0,emT:0,emCd:0,stabT:0,tcd:0,hurtT:0,pcd:0,hunger:100,timer:60,walk:0,face:0,aim:0,ringT:rnd(25,60),flags:new Set()},o||{});}

function hasItem(e,k){return e.items&&e.items.includes(k);}
function takeItem(e,k){const i=e.items.indexOf(k);if(i>=0){e.items.splice(i,1);if(e.sel>=e.items.length)e.sel=Math.max(0,e.items.length-1);}}
function give(e,k){if(ITEMS[k].kind==='card'){if(e.card<ITEMS[k].lvl){e.card=ITEMS[k].lvl;if(e.isPlayer)msgTo(e,'💳 You now have a level '+e.card+' keycard!','#b9f');}if(e.role==='dclass')makeRogue(e);return true;}if(e.items.length>=6){if(e.isPlayer)msgTo(e,'Your hands are full (6 items). Drop something with G.');return false;}e.items.push(k);if(e.isPlayer){e.sel=e.items.length-1;if(e.role==='dclass'&&isWeapon(k))makeRogue(e);}return true;}
function giveKey(e){if(e.isPlayer&&e.kind==='h'&&!e.sticky&&e.card>=1&&!hasItem(e,'keycard')&&e.items.length<6){const cur=e.items[e.sel];e.items.unshift('keycard');e.sel=cur?e.items.indexOf(cur):0;}}

function itemCol(k){if(!k)return'#c8955a';if(k==='breadR'||k==='meat')return'#c0392b';const kd=ITEMS[k].kind;return kd==='gun'||kd==='melee'||kd==='tranq'||kd==='flame'||kd==='card'||kd==='key'?'#8a8f96':'#c8955a';}
function makeRogue(e){if(e.rogue||e.role!=='dclass')return;e.rogue=true;if(e.isPlayer){msgTo(e,'🚨 You are now a ROGUE D-class. Guards will shoot you!','#ff6b6b');}}
function hurt(t,dmg,src,cause){if(!t||t.dead||t.inSlide||t.ghost)return;if(t.kind==='a'&&AD[t.type].inv)return;if(src&&src!==t){if(t.kind==='a'){t.aggro=7;t.aggroBy=src;}if(src.kind==='h'&&src.role==='dclass'&&t.kind==='h'&&t.role!=='dclass')makeRogue(src);if(t.kind==='h'&&t.role==='dclass'&&!t.rogue&&src.kind==='h'&&!t.isPlayer&&src.isPlayer&&src.role==='dclass')makeRogue(src);}
 if(t.job&&t.job.type==='test'&&src===t.job.a&&(t.job.act==='blue'||t.job.act==='pet'))finishTest(t,true);
 t.lastCause=cause||null;t.lastSrc=src||null;t.hp-=dmg;t.hurtT=.18;puff(t.x,t.y,'#c0141a',3,80,.35,2);if(t===P)SFX.hit();if(t.hp<=0)kill(t,src,cause);}
function kill(t,src,cause){if(t.dead)return;if(t.job&&t.job.type==='test'&&src&&src===t.job.a)finishTest(t,true);t.dead=true;t.hp=0;t.deathCause=cause||'killed';t.killedBy=src||null;t.lastCause=cause||null;t.lastSrc=src||null;if(t.job&&t.job.type==='test'&&t.job.by&&t.job.by.isPlayer&&!t.job.by.dead){earnTo(t.job.by,3,'learned something when '+t.name+' died in your test');}if(t.carry){t.carry.carried=null;t.carry=null;}
 if(src&&src.kind==='a'&&src!==t)src.kills=(src.kills||0)+1;
 if(cause&&cause.includes('inside out'))addMess(t.x,t.y,'blood');
 else if(t.kind==='h'&&!/eaten|chomp|slide|bread|flattened/.test(cause||''))addMess(t.x,t.y,'corpse',{role:t.role,col:t.color,skin:t.skin||'#151515',steven:t.steven,sticky:t.sticky,hx:rnd(18,30)*(Math.random()<.5?-1:1),hy:rnd(-8,10),t0:gameT,rot:rnd(-.4,.4)});
 puff(t.x,t.y,cause&&cause.includes('inside out')?'#c0141a':'#cfd6de',12,150,.6,3);
 if(t.kind==='h'&&!t.isPlayer&&t.role==='guard'&&Math.random()<.5)pickups.push({x:t.x,y:t.y,item:'card4',life:70});
 if(src&&src.isPlayer&&src!==t)rewardTo(src,t);
 if(t.type==='ee3'&&/starved/.test(cause||''))for(const h of ents.concat(P&&P.dead?[]:[]))if(h.kind==='h'&&h.isPlayer&&h.test&&h.test.act==='feed'&&h.test.a===t){earnTo(h,-15,'Spikester STARVED because you didn\'t feed him!');if(h===P){P.test=null;}}
 if(src&&src.type==='ee12'&&t.kind==='h'){src.disguised=true;src.fake=t.name;src.disRole=t.role;src.color=t.color;src.skin=t.skin;src.eye=t.eye;if(src.isPlayer)msgTo(src,'🎭 You took '+t.name+'\'s clothes and name. You look just like them now.','#ffcf7a');}
 if(t.isPlayer){if(t===P)onPlayerDeath(cause||'something');if(t.kind==='a'&&t.type!=='ee58'&&!NET.client)respawnQ.push({t:20,fn:()=>spawnAnomNPC(t.type)});}
 else if(t.kind==='h')respawnQ.push({t:25,fn:()=>spawnNPC(t.role)});
 else{respawnQ.push({t:20,fn:()=>spawnAnomNPC(t.type)});if(!AD[t.type].play)msg(t.name+' was neutralized. It will reform in its cell.','#ffcf7a');}
 if(t.kind==='a'&&t.type!=='ee58'&&t.type!=='bsp'&&!NET.client&&!/trash/.test(cause||''))announce('Anomaly '+spokenId(t.type)+', has been neutralized.','n'+t.type);
 if(t.kind==='h'&&!t.isPlayer&&P&&dist(t,P)<12*T)msg(t.name+' was '+(cause||'killed')+'.','#ff9a9a');}
function reward(p,t){
 if(t.type==='ee8'){p.sad=true;if(p===P)msg('💙 You killed Glob. You feel terrible. (Sad until you die or leave.)','#7fb8ff');}
 if(p.kind==='a'){if(t.kind==='h'){earn(5,'got '+t.name);if(p.type==='ee3'&&p.hunger<=25){earn(5,'starving bonus');p.hunger=Math.min(100,p.hunger+40);say(p,'*munch*');}}return;}
 if(t.kind==='a'){if(isOut(t)&&(t.kills||0)>=3)earn(5,'stopped a rampaging '+t.name+' (caging it pays more!)');else earn(-1,'Don\'t do that! We CONTAIN anomalies. Cage them!');return;}
 if(p.role==='dclass'){if(t.role==='guard'){earn(10,'took down a guard');if(t.card>p.card){p.card=t.card;msg('💳 Stole a level '+t.card+' keycard!','#b9f');}}return;}
 if(t.role==='dclass'){if(t.rogue||t.fleeing){if(p.role==='guard')earn(10,'took down a rogue D-class');}else earn(-1,'Don\'t kill innocent D-class!');return;}
 earn(-1,'Don\'t kill your coworkers!');}
const TRQ={Safe:3,Scaper:3,Euclid:5,Conditional:5,Keter:8};
function tranq(t,by){if(t.dead||t.inSlide)return;if(t.kind==='a'&&t.type==='ee1')return;puff(t.x,t.y,'#7dff9b',8,70,.6,2);
 if(t.kind==='h'){t.sleep=5;say(t,'Zzz...',5);if(t.isPlayer)msgTo(t,'💤 You were tranquilized!','#7dff9b');return;}
 if(t.type==='ee20'&&!t.breached&&!isOut(t)){t.sleep=15;t.timer=60;say(t,'Zzz...',15);if(by&&by.isPlayer){earnTo(by,10,'tranquilized Twig');bonusProg(120);if(by.flags)by.flags.add('tranqTwig');}if(t.isPlayer)msgTo(t,'💤 A tranq dart reset your timer!','#7dff9b');return;}
 if(t.bake){floatTxt(t.x,t.y-26,'too busy baking!','#7dff9b');return;}
 if(!isOut(t)&&t.type!=='ee20'){floatTxt(t.x,t.y-26,'no effect','#7dff9b');if(by&&by.isPlayer)msgTo(by,'Tranqs are only for rogue D-class, breached anomalies and Twig. Use a CAGE (C) instead!');return;}
 const need=TRQ[CLS[t.type]]||5;t.drowsy=(t.drowsy||0)+1;
 if(t.drowsy>=need){t.drowsy=0;t.sleep=t.type==='ee20'?15:10;say(t,'Zzz...',t.sleep);msg('💤 '+t.name+' fell asleep! Staff can recontain it now (E).','#7dff9b');if(t.isPlayer)msgTo(t,'💤 Too many tranq darts... you passed out!','#7dff9b');}
 else floatTxt(t.x,t.y-26,'drowsy '+Math.floor(t.drowsy)+'/'+need,'#7dff9b');}
function recontain(a,by){const h=anomHome(a.type);a.x=h.x;a.y=h.y;a.cage=0;a.sleep=Math.max(a.sleep||0,1.5);a.yeastMode=false;a.path=null;a.goal=null;a.state='idle';for(const d of cellDoors(a.home)){d.broken=false;d.jelly=false;d.hold=false;d.open=0;}if(a.type==='ee20'){a.timer=60;a.breached=false;}a.hunger=Math.max(a.hunger,60);
 puff(a.x,a.y,'#9cf',16,140,.6,3);msg('🔒 '+a.name+' was recontained'+(by?' by '+by.name:'')+'.','#9cf');if(by&&by.isPlayer){earnTo(by,10,'recontained '+a.name);bonusProg(120);}if(a.isPlayer)msgTo(a,'You were dragged back into your cell!','#ffcf7a');}
const YEASTY=['yeast','sandwich','pizza'];
const FOODOF={ee8:'lettuce',ee24:'bread',ee12:'meat',ee9:'sandwich',ee3:'sandwich',ee42:'meat'};
function accepts(a,k){const fd=AD[a.type].food;return fd==='any'||(fd&&fd.includes(k))||(a.type==='ee24'&&YEASTY.includes(k));}
function feed(e,a,k){if(!accepts(a,k)){msg(a.type==='ee12'?'Emmett only eats meat.':a.type==='ee8'?'Glob only wants lettuce.':'It doesn\'t want that.');return false;}takeItem(e,k);doFeed(a,k,e);return true;}
function doFeed(a,k,e){a.hunger=100;a.roared=false;a.roarT=0;puff(a.x,a.y-10,'#ff7ab8',6,60,.8,3);say(a,a.type==='ee8'?'Glob! ♥':a.type==='ee24'?'*nom*':'*munch*');SFX.munch();
 if(e&&e.flags)e.flags.add('fed_'+a.type);if(e&&e.isPlayer)earnTo(e,e.role==='dclass'?3:1,'fed '+a.name);
 if(a.type==='ee24'&&YEASTY.includes(k)&&!a.yeastMode)yeastMode(a);if(a.isPlayer)msgTo(a,'🍽 '+(e?e.name:'The conveyor')+' fed you '+ITEMS[k].n+'.','#ffcf7a');}
function trayPut(tr,e,k){if(tr.food){msg('The tray is busy.');return;}takeItem(e,k);tr.food=k;tr.t=2.2;tr.by=e;msg('🍽 '+ITEMS[k].n+' is riding the conveyor into the cell...');}
function updTrays(dt){for(const tr of TRAYS){if(!tr.food)continue;tr.t-=dt;if(tr.t>0)continue;const r=tr.room,d=r.door2;const p={x:d.cx+rnd(-1.5,1.5)*T,y:d.cy+(r.top?-1.6:1.6)*T,item:tr.food,life:900,by:tr.by,globOk:Math.random()<.25};pickups.push(p);
 if(tr.by&&tr.by.isPlayer)msgTo(tr.by,'🍽 The food landed in '+r.name.split(' · ')[0]+'\'s cell. It has to walk over and eat it.');tr.food=null;}}
function foodInCell(r){return pickups.some(p=>roomOf(p)===r)||(r.tray&&r.tray.food);}
function anomEats(a,p){const k=p.item;const i=pickups.indexOf(p);if(i>=0)pickups.splice(i,1);if(a.type==='ee24'){if(YEASTY.includes(k)){a.glowing=true;if(!a.yeastMode)yeastMode(a);}if(a.isPlayer){a.hunger=100;startBake(a,itemCol(k),ITEMS[k].n);}else{a.hunger=100;say(a,'*nom*');}if(p.by&&p.by.flags)p.by.flags.add('fed_ee24');if(p.by&&p.by.isPlayer)earnTo(p.by,p.by.role==='dclass'?3:1,'fed '+a.name);return;}doFeed(a,k,p.by);}
function eatFloor(a,dt){if(!AD[a.type].food&&a.type!=='ee24')return false;const ok=p=>a.type==='ee24'||accepts(a,p.item)||(a.type==='ee8'&&p.globOk);let best=null,bd=6*T;for(const p of pickups){if(!ok(p)||roomOf(p)!==roomOf(a)||(p.fresh||0)>gameT)continue;const d=dist(a,p);if(d<bd){bd=d;best=p;}}
